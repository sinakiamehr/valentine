<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Be My Valentine</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="container">
<h1 id="title" class="title">Will you be my Valentine?👀</h1>
<section id="visual" class="animation" aria-label="Cute cat with heart">
<img src="Otti.jpg" alt="Otti the cat" class="cat" style="width:220px;height:auto;border-radius:16px;">
</section>
<section class="controls">
<button id="yesBtn" class="btn btn--yes" aria-label="Yes">Yes</button>
<button id="noBtn" class="btn btn--no" aria-label="No">No</button>
</section>
</main>
<div id="overlay" class="overlay" aria-live="polite" hidden>
<div class="overlay-content">
<div class="overlay-text">Yay! See you on Valentine’s Day 🦦❤️</div>
<img src="Sina.png" alt="Happy Valentine" class="overlay-img">
</div>
</div>
<script src="script.js"></script>
</body>
</html>
